<section class="slide slide--title slide--title-split" data-slide="{{slide_number}}">
  <div class="split-left">
    {{cover_logo_block}}
    <div class="title-eyebrow">{{eyebrow}}</div>
    <h1 class="title-headline">{{title}}</h1>
    <div class="title-subhead">{{subtitle}}</div>
    <dl class="title-meta">
      <dt>Prepared for</dt><dd>{{prepared_for}}</dd>
      <dt>Prepared by</dt><dd>{{prepared_by}}</dd>
      <dt>Date</dt><dd>{{date}}</dd>
    </dl>
  </div>
  <div class="split-right">
    <div class="split-mark">{{brand_mark}}</div>
    <div class="split-strapline">{{strapline}}</div>
  </div>
</section>
