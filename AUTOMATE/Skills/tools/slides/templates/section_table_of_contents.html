<section class="slide slide--section-toc" data-slide="{{slide_number}}">
  <div class="section-toc__top">{{contents_label}}</div>
  <div class="section-toc__list">
    {{body}}
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
