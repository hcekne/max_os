<section class="slide slide--data-small-multiples" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <h1 class="slide__title">{{title}}</h1>
  {{subtitle_block}}
  <div class="slide__body">
    <div class="small-multiples-grid">
      <div class="sm-pane">
        <div class="sm-pane__label">{{sm1_label}}</div>
        <div class="sm-pane__chart">{{sm1_body_md}}</div>
      </div>
      <div class="sm-pane">
        <div class="sm-pane__label">{{sm2_label}}</div>
        <div class="sm-pane__chart">{{sm2_body_md}}</div>
      </div>
      <div class="sm-pane">
        <div class="sm-pane__label">{{sm3_label}}</div>
        <div class="sm-pane__chart">{{sm3_body_md}}</div>
      </div>
      <div class="sm-pane">
        <div class="sm-pane__label">{{sm4_label}}</div>
        <div class="sm-pane__chart">{{sm4_body_md}}</div>
      </div>
    </div>
    {{kicker_block}}
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
