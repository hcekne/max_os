<section class="slide slide--framework-lettered" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <h1 class="slide__title">{{title}}</h1>
  {{subtitle_block}}
  <div class="slide__body">
    <div class="lettered-grid">
      <aside class="lettered-grid__sidebar">
        <div class="lettered-grid__group lettered-grid__group--top">{{group_a_label}}</div>
        <div class="lettered-grid__group lettered-grid__group--bottom">{{group_b_label}}</div>
      </aside>
      <div class="lettered-grid__rows">
        {{body}}
      </div>
    </div>
    {{kicker_block}}
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
