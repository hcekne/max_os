<section class="slide slide--framework-capacity-2x2" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <h1 class="slide__title">{{title}}</h1>
  {{subtitle_block}}
  <div class="slide__body">
    <div class="capacity-2x2-grid">
      <div class="capacity-card-v2">
        <h3>{{c1_title}}</h3>
        <div class="capacity-card-v2__body">{{c1_body_md}}</div>
      </div>
      <div class="capacity-card-v2">
        <h3>{{c2_title}}</h3>
        <div class="capacity-card-v2__body">{{c2_body_md}}</div>
      </div>
      <div class="capacity-card-v2">
        <h3>{{c3_title}}</h3>
        <div class="capacity-card-v2__body">{{c3_body_md}}</div>
      </div>
      <div class="capacity-card-v2">
        <h3>{{c4_title}}</h3>
        <div class="capacity-card-v2__body">{{c4_body_md}}</div>
      </div>
    </div>
    {{kicker_block}}
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
