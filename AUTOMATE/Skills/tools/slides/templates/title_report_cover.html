<section class="slide slide--title-report-cover" data-slide="{{slide_number}}">
  <div class="trc-left">
    {{cover_logo_block}}
    <div class="trc-eyebrow">{{eyebrow}}</div>
    <div class="trc-stack">
      <h1 class="trc-title">{{title}}</h1>
      <div class="trc-meta">
        <span class="trc-kind">{{kind}}</span>
        <span class="trc-date">{{date}}</span>
      </div>
    </div>
  </div>
  <div class="trc-hero">
    <img class="trc-hero-img" src="{{hero_image}}" alt="">
    <div class="trc-hero-motif" aria-hidden="true"></div>
  </div>
</section>
