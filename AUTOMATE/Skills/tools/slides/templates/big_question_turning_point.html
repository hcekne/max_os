<section class="slide slide--big-question" data-slide="{{slide_number}}">
  <div class="big-question">
    <div class="big-question__eyebrow">{{eyebrow}}</div>
    <h1 class="big-question__text">{{question}}</h1>
    <div class="big-question__hint">{{hint}}</div>
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
</section>
