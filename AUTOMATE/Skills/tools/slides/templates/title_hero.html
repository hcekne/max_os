<section class="slide slide--title slide--title-hero" data-slide="{{slide_number}}">
  <div class="hero-bg" style="background-image: url('{{hero_image}}');"></div>
  <div class="hero-tint"></div>
  {{cover_logo_block}}
  <div class="hero-overlay">
    <div class="title-eyebrow">{{eyebrow}}</div>
    <h1 class="title-headline">{{title}}</h1>
    <div class="title-subhead">{{subtitle}}</div>
    <dl class="title-meta">
      <dt>Prepared for</dt><dd>{{prepared_for}}</dd>
      <dt>Prepared by</dt><dd>{{prepared_by}}</dd>
      <dt>Date</dt><dd>{{date}}</dd>
    </dl>
  </div>
</section>
