<section class="slide slide--big-number" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <div class="slide__body big-number-body">
    <div class="big-number__label">{{number_label}}</div>
    <div class="big-number__hero">{{number}}</div>
    <div class="big-number__subtext">{{subtext}}</div>
    {{kicker_block}}
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
