<section class="slide slide--def-two-lists" data-slide="{{slide_number}}">
  <div class="def-two-lists">
    <div class="def-two-lists__rail">
      <div class="def-two-lists__eyebrow">{{eyebrow}}</div>
      <h1 class="def-two-lists__question">{{title}}</h1>
    </div>
    <div class="def-two-lists__main">
      <div class="def-two-lists__lead">{{lead_md}}</div>
      <div class="def-two-lists__cols">
        {{body}}
      </div>
    </div>
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
