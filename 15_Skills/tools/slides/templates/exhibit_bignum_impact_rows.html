<section class="slide slide--bignum-impact" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <div class="exhibit-label">{{exhibit_label}}</div>
  <h1 class="slide__title">{{title}}</h1>
  <p class="takeaway">{{subtitle}}</p>
  <div class="slide__body">
    <div class="bignum-impact-grid">
      <div class="bignum-block">
        <div class="bignum">{{bignum}}</div>
        <div class="bignum-label">{{bignum_label}}</div>
      </div>
      <div class="impact-rows">
        {{body}}
      </div>
    </div>
    <div class="callout bignum-band">{{band_md}}</div>
  </div>
  <div class="source-note">{{source}}</div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
