<section class="slide slide--quote-extended" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <div class="slide__body">
    <div class="quote-extended">
      <div class="quote-extended__portrait" style="background-image: url('{{portrait_image}}');"></div>
      <div class="quote-extended__content">
        <div class="quote-extended__source-mark">{{source_mark}}</div>
        <blockquote class="quote-extended__text">{{quote_body_md}}</blockquote>
        <div class="quote-extended__attribution">{{attribution}}</div>
        <div class="quote-extended__role">{{attribution_role}}</div>
      </div>
    </div>
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
