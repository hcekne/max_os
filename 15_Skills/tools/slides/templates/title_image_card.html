<section class="slide slide--title slide--title-image-card" data-slide="{{slide_number}}">
  {{cover_logo_block}}
  <div class="image-card-left">
    <div class="title-eyebrow">{{eyebrow}}</div>
    <h1 class="title-headline">{{title}}</h1>
    <div class="title-subhead">{{subtitle}}</div>
    <dl class="title-meta">
      <dt>Prepared for</dt><dd>{{prepared_for}}</dd>
      <dt>Prepared by</dt><dd>{{prepared_by}}</dd>
      <dt>Date</dt><dd>{{date}}</dd>
    </dl>
  </div>
  <div class="image-card-right" style="background-image: url('{{hero_image}}');">
    <div class="image-card-caption">{{caption}}</div>
  </div>
</section>
