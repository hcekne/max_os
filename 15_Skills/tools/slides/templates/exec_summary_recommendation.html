<section class="slide slide--exec-summary-rec" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <h1 class="slide__title">{{title}}</h1>
  {{subtitle_block}}
  <div class="slide__body">
    <div class="exec-rec-hero">
      <div class="exec-rec-label">{{recommendation_label}}</div>
      <div class="exec-rec-statement">{{recommendation}}</div>
    </div>
    <div class="exec-rec-support">
      {{body}}
    </div>
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
