<section class="slide slide--asks-sponsor" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <h1 class="slide__title">{{title}}</h1>
  {{subtitle_block}}
  <div class="slide__body">
    <div class="asks">
      <div class="asks__intro">
        <div class="asks__intro-label">{{intro_label}}</div>
        <div class="asks__intro-body">{{intro_body_md}}</div>
      </div>
      <div class="asks__list">
        {{body}}
      </div>
    </div>
    {{kicker_block}}
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
