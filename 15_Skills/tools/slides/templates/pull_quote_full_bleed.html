<section class="slide slide--pull-quote-full" data-slide="{{slide_number}}">
  <div class="pull-quote-full">
    <div class="pull-quote-full__mark">&ldquo;</div>
    <blockquote class="pull-quote-full__text">{{quote}}</blockquote>
    <div class="pull-quote-full__attrib">{{attribution}}</div>
    <div class="pull-quote-full__role">{{attribution_role}}</div>
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
</section>
