<section class="slide slide--closing slide--closing-team" data-slide="{{slide_number}}">
  {{cover_logo_block}}
  <div class="closing-team__top">
    <div class="closing-headline">{{title}}</div>
    <div class="closing-subhead">{{subtitle}}</div>
  </div>
  <div class="closing-team__credits">
    <div class="closing-team__credits-label">{{credits_label}}</div>
    <div class="closing-team__credits-grid">
      <div class="team-credit">
        <div class="team-credit__name">{{p1_name}}</div>
        <div class="team-credit__role">{{p1_role}}</div>
      </div>
      <div class="team-credit">
        <div class="team-credit__name">{{p2_name}}</div>
        <div class="team-credit__role">{{p2_role}}</div>
      </div>
      <div class="team-credit">
        <div class="team-credit__name">{{p3_name}}</div>
        <div class="team-credit__role">{{p3_role}}</div>
      </div>
      <div class="team-credit team-credit--optional">
        <div class="team-credit__name">{{p4_name}}</div>
        <div class="team-credit__role">{{p4_role}}</div>
      </div>
    </div>
    <div class="closing-team__contact">{{contact}}</div>
  </div>
</section>
