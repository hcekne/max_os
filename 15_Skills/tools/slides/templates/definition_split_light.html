<section class="slide slide--def-split-light" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <div class="slide__body">
    <div class="def-split">
      <div class="def-split__rail">
        <h1 class="def-split__question">{{title}}</h1>
        <p class="def-split__subtitle">{{subtitle}}</p>
      </div>
      <div class="def-split__main">
        <div class="def-split__lead">{{lead_md}}</div>
        <div class="def-split__cols">
          {{body}}
        </div>
      </div>
    </div>
  </div>
  <div class="source-note">{{source}}</div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
