<section class="slide slide--actions-kpi" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <h1 class="slide__title">{{title}}</h1>
  {{subtitle_block}}
  <div class="slide__body">
    <div class="actions-stack">
      <div class="actions-stack__header">
        <div class="actions-stack__header-action">{{actions_header}}</div>
        <div class="actions-stack__header-kpi">{{kpi_header}}</div>
      </div>
      {{body}}
      <div class="actions-stack__total">
        <div class="actions-stack__total-label">{{total_label}}</div>
        <div class="actions-stack__total-value">{{total_value}}</div>
      </div>
    </div>
    {{kicker_block}}
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
