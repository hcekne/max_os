<section class="slide slide--rings" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <h1 class="slide__title">{{title}}</h1>
  {{subtitle_block}}
  <div class="slide__body">
    <div class="rings-row">
      <div class="rings-visual">
        <div class="ring ring--4">
          <div class="ring ring--3">
            <div class="ring ring--2">
              <div class="ring ring--1">
                <div class="ring__core">{{core_label}}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="rings-legend">
        <div class="ring-row">
          <div class="ring-row__swatch ring-row__swatch--1"></div>
          <div class="ring-row__content">
            <div class="ring-row__title">{{r1_title}}</div>
            <div class="ring-row__body">{{r1_body}}</div>
          </div>
        </div>
        <div class="ring-row">
          <div class="ring-row__swatch ring-row__swatch--2"></div>
          <div class="ring-row__content">
            <div class="ring-row__title">{{r2_title}}</div>
            <div class="ring-row__body">{{r2_body}}</div>
          </div>
        </div>
        <div class="ring-row">
          <div class="ring-row__swatch ring-row__swatch--3"></div>
          <div class="ring-row__content">
            <div class="ring-row__title">{{r3_title}}</div>
            <div class="ring-row__body">{{r3_body}}</div>
          </div>
        </div>
        <div class="ring-row">
          <div class="ring-row__swatch ring-row__swatch--4"></div>
          <div class="ring-row__content">
            <div class="ring-row__title">{{r4_title}}</div>
            <div class="ring-row__body">{{r4_body}}</div>
          </div>
        </div>
      </div>
    </div>
    {{kicker_block}}
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
