<section class="slide slide--section-divider-hero" data-slide="{{slide_number}}">
  <div class="sdh-left">
    {{cover_logo_block}}
    <div class="sdh-stack">
      <h1 class="sdh-title">{{title}}</h1>
      <div class="sdh-accent-label">{{accent_label}}</div>
    </div>
    <div class="sdh-date">{{date}}</div>
  </div>
  <div class="sdh-motif" aria-hidden="true">
    <img class="sdh-hero-img" src="{{hero_image}}" alt="">
    <div class="sdh-arcs"></div>
  </div>
</section>
