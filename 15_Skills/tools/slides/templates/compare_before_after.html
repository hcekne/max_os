<section class="slide slide--compare-ba" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <h1 class="slide__title">{{title}}</h1>
  {{subtitle_block}}
  <div class="slide__body">
    <div class="ba-row">
      <div class="ba-pane ba-pane--before">
        <div class="ba-pane__label">{{before_label}}</div>
        <div class="ba-pane__headline">{{before_headline}}</div>
        <div class="ba-pane__body">{{before_body_md}}</div>
      </div>
      <div class="ba-arrow"></div>
      <div class="ba-pane ba-pane--after">
        <div class="ba-pane__label">{{after_label}}</div>
        <div class="ba-pane__headline">{{after_headline}}</div>
        <div class="ba-pane__body">{{after_body_md}}</div>
      </div>
    </div>
    {{kicker_block}}
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
