<section class="slide slide--headline-stack" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <div class="slide__body headline-stack">
    <div class="headline-stack__top">
      <h1 class="headline-stack__headline">{{headline}}</h1>
      <div class="headline-stack__deck">{{deck}}</div>
    </div>
    <div class="headline-stack__notes">
      {{body}}
    </div>
    {{kicker_block}}
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
