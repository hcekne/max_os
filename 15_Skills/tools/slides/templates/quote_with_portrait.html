<section class="slide slide--quote-portrait" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <div class="slide__body">
    <div class="quote-block">
      <div class="quote-block__mark">&ldquo;</div>
      <blockquote class="quote-block__text">{{quote}}</blockquote>
      <div class="quote-block__portrait" style="background-image: url('{{portrait_image}}');"></div>
      <div class="quote-block__attribution">{{attribution}}</div>
      <div class="quote-block__role">{{attribution_role}}</div>
    </div>
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
