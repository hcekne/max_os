<section class="slide slide--exec-summary-pyramid" data-slide="{{slide_number}}">
  <header class="slide__header">
    <div class="slide__eyebrow">{{eyebrow}}</div>
    <div class="slide__page-number">{{slide_number}} / {{slide_count}}</div>
  </header>
  <h1 class="slide__title">{{title}}</h1>
  {{subtitle_block}}
  <div class="slide__body">
    <div class="pyramid-top">
      <div class="pyramid-label">{{governing_label}}</div>
      <div class="pyramid-thought">{{governing_thought}}</div>
    </div>
    <div class="pyramid-base">
      <div class="pyramid-arg">
        <div class="pyramid-arg__title">{{arg_1_title}}</div>
        <div class="pyramid-arg__body">{{arg_1_body_md}}</div>
      </div>
      <div class="pyramid-arg">
        <div class="pyramid-arg__title">{{arg_2_title}}</div>
        <div class="pyramid-arg__body">{{arg_2_body_md}}</div>
      </div>
      <div class="pyramid-arg">
        <div class="pyramid-arg__title">{{arg_3_title}}</div>
        <div class="pyramid-arg__body">{{arg_3_body_md}}</div>
      </div>
    </div>
  </div>
  <footer class="slide__footer">
    <div>{{footer_left}}</div>
    <div>{{footer_right}}</div>
  </footer>
  <div class="notes">{{notes}}</div>
</section>
